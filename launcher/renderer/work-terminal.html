<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>品品 work session 终端</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles/terminal.css" />
  <link rel="stylesheet" href="./styles/work-terminal.css" />
</head>
<body>

<div class="term-window">

  <header class="term-header">
    <div class="term-title">
      <span class="health-dot green" id="health"></span>
      <strong id="header-name">work session</strong>
      <span class="meta" id="header-meta">—</span>
    </div>
    <div class="spacer"></div>
    <button class="term-btn" id="btn-clear" title="清屏 (本地 xterm 清，不影响 work)">清屏</button>
    <button class="term-btn term-btn-danger" id="btn-end" title="结束 work session">✕ 结束</button>
  </header>

  <div class="term-stream" id="term-stream"></div>

  <footer class="term-input-area">
    <div class="input-row">
      <textarea id="input-text" rows="2" placeholder="给 work session 发新指令（PTY write 进 stdin）...&#10;Ctrl+Enter 发送"></textarea>
      <button class="send-btn" id="btn-send">发送</button>
    </div>
    <div class="input-hint">提示：关闭本窗口 ≠ 结束 work；想真正终止 work 点[✕ 结束]</div>
  </footer>

</div>

<script type="module" src="./work-terminal.ts"></script>
</body>
</html>
